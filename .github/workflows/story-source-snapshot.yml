name: Story continuation source snapshot
on:
  push:
    branches: [work/story-source-20261028]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source history only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/feat/native-battle-initialization)" = 7898cf137e2655c006c0d6d8782e6df8b28475c9
          mkdir -p export
          git bundle create export/story-source.bundle refs/remotes/origin/feat/native-battle-initialization refs/remotes/origin/feat/native-field-items
          git bundle verify export/story-source.bundle
          sha256sum export/story-source.bundle > export/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: story-continuation-source
          path: export/
          retention-days: 1
          if-no-files-found: error
