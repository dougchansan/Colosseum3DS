name: Verify private reference inputs

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf

defaults:
  run:
    shell: pwsh

jobs:
  original-hashes:
    if: >-
      github.event.repository.private == true &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, colosseum3ds-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check every original against the pinned canonical hashes
        run: |
          $mount = "type=bind,source=$env:GITHUB_WORKSPACE,target=/verify,readonly"
          docker run --rm --entrypoint python3 --mount $mount ghcr.io/dougchansan/pkmn-colosseum-build@sha256:66e4fe838b6fe86dd97c72b08ade1520a5dd728640063678bf16bfa17e28c812 /verify/tools/verify_inputs.py --orig /orig/GC6E01
          if ($LASTEXITCODE -ne 0) { throw "Private original verification failed ($LASTEXITCODE)" }
      # No cache or artifact: original game bytes stay inside the private job.
